name: DEMO CI SPRING BOOT FLOW
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean test bootJar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-spring-boot-app
          path: build/libs/*.jar

  build_image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-spring-boot-app
          path: build/libs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Tag Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/demo-ci-springboot:1.0.1 .
          docker build -t ghcr.io/${{ github.repository_owner }}/demo-ci-springboot:latest .

      - name: Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/demo-ci-springboot:1.0.1
          docker push ghcr.io/${{ github.repository_owner }}/demo-ci-springboot:latest
